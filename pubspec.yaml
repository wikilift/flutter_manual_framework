name: omni_manuals
description: Flutter SDK for presenting Omni Manuals through the canonical runtime.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.1
  flutter: ">=3.38.0"

dependencies:
  archive: ^4.0.7
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  assets:
    - assets/runtime/
    - assets/runtime/src/
    - assets/runtime/src/components/
    - assets/runtime/styles/
